[package]
name = "utter"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Turn natural language into shell commands, delivered into your shell's input buffer"
license = "MIT"
repository = "https://github.com/harshtomar6/utter"

[dependencies]
# Single HTTP call per invocation, no concurrency — current_thread runtime only.
tokio = { version = "1.53", features = ["rt", "macros", "time"] }
# reqwest 0.13 renamed `rustls-tls` to `rustls` and split cert roots into their own
# feature. `webpki-roots` bundles Mozilla's set into the binary rather than reading
# the system trust store — one less thing to differ across the four release targets.
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "rustls",
    "webpki-roots",
    "http2",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.6", features = ["derive"] }
anyhow = "1.0"
thiserror = "2.0"
directories = "6.0"
which = "8.0"
regex = "1.13"
toml = "1.1"

# Config for 'dist'
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

# The profile that 'dist' will build with

[package]
name = "utter"
version = "0.2.0"
edition = "2021"
rust-version = "1.80"
description = "Turn natural language into shell commands, delivered into your shell's input buffer"
license = "MIT"
repository = "https://github.com/harshtomar6/utter"

[dependencies]
# Single HTTP call per invocation, no concurrency — current_thread runtime only.
tokio = { version = "1.53", features = ["rt", "macros", "time"] }
# reqwest 0.13 renamed `rustls-tls` to `rustls` and split cert roots into their own
# feature. `webpki-roots` bundles Mozilla's set into the binary rather than reading
# the system trust store — one less thing to differ across the four release targets.
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "rustls",
    "webpki-roots",
    "http2",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.6", features = ["derive"] }
anyhow = "1.0"
thiserror = "2.0"
directories = "6.0"
which = "8.0"
regex = "1.13"
toml = "1.1"

# Config for 'dist'
[workspace.metadata.dist]
# `dist generate` refuses to run without this marker, and `dist init` does not
# write it back — so it is maintained here by hand.
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
# Keep Windows on the same archive format as every other target so install.sh has
# a single extraction path. Git Bash ships `tar`, and Windows 10+ has tar.exe
# natively, so uniformity costs a Windows user nothing.
windows-archive = ".tar.xz"
# Path that installers should place binaries in
install-path = "~/.local/bin"
# Where to host releases
hosting = "github"
# `dist plan` otherwise refuses to run because .github/workflows/release.yml is
# not the file it would generate. It is hand-authored because
# `dist generate --mode=ci` exits 0 without writing anything on 0.32, and the
# interactive `dist init` wizard cannot be driven headlessly. The build steps
# still call `dist build`, so artifacts, names and checksums remain canonical.
allow-dirty = ["ci"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
